name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm run compile

      - name: Run test suite
        run: pnpm test -- --reporter=default --reporter=github-actions

      - name: Build extension bundle
        run: pnpm run build

      - name: Publish Test & Build Summary
        if: always()
        shell: bash
        run: |
          echo "## 📊 CI Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform Matrix** | \`${{ matrix.os }}\` / Node \`${{ matrix.node-version }}\` | 🖥️ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dependency Audit** | \`pnpm audit\` | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript Typecheck** | \`pnpm run compile\` | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vitest Unit Suite** | \`pnpm test\` | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Extension Bundle** | \`pnpm run build\` (\`dist/extension.js\`) | :package: Built |" >> $GITHUB_STEP_SUMMARY

