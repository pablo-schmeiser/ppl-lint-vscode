name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm run compile

      - name: Run test suite
        run: pnpm test -- --reporter=default --reporter=github-actions

      - name: Run integration tests
        run: pnpm run test:integration --reporter=default --reporter=github-actions

      - name: Build extension bundle
        run: pnpm run build

      - name: Publish Test & Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 📊 CI Build & Test Summary"
            echo ""
            echo "| Check | Target | Status |"
            echo "| :--- | :--- | :---: |"
            echo "| **Platform Matrix** | \`${{ matrix.os }}\` / Node \`${{ matrix.node-version }}\` | 🖥️ |"
            echo "| **Dependency Audit** | \`pnpm audit\` | :white_check_mark: Passed |"
            echo "| **TypeScript Typecheck** | \`pnpm run compile\` | :white_check_mark: Passed |"
            echo "| **Vitest Unit Suite** | \`pnpm test\` | :white_check_mark: Passed |"
            echo "| **Vitest Integration Suite** | \`pnpm run test:integration\` | :white_check_mark: Passed |"
            echo "| **Extension Bundle** | \`pnpm run build\` (\`dist/extension.js\`) | :package: Built |"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run pre-commit
        id: pre_commit
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Commit fixes back to branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix linting and formatting issues [skip ci]"
          file_pattern: "*"

      - name: Verify pre-commit passed
        if: steps.pre_commit.outcome == 'failure'
        run: pre-commit run --all-files --show-diff-on-failure
